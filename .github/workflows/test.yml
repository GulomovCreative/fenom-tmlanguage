name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Check the grammar is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('fenom.tmLanguage.json', 'utf8'))"

      - name: Run grammar snapshot tests
        run: npm test
