<svg xmlns="http://www.w3.org/2000/svg" width="551" height="336" viewBox="0 0 551 336" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <rect width="551" height="336" rx="8" fill="#24292e"/>
  <g>
    <text x="18" y="31.0" xml:space="preserve" style="white-space:pre"><tspan fill="#6A737D">{* Product card *}</tspan></text>
    <text x="18" y="51.0" xml:space="preserve" style="white-space:pre"><tspan fill="#E1E4E8">&lt;</tspan><tspan fill="#85E89D">article</tspan><tspan fill="#E1E4E8"> </tspan><tspan fill="#B392F0">class</tspan><tspan fill="#E1E4E8">=</tspan><tspan fill="#9ECBFF">"card"</tspan><tspan fill="#E1E4E8">&gt;</tspan></text>
    <text x="18" y="71.0" xml:space="preserve" style="white-space:pre"><tspan fill="#E1E4E8">  {</tspan><tspan fill="#F97583">if</tspan><tspan fill="#E1E4E8"> $product</tspan><tspan fill="#F97583">-&gt;</tspan><tspan fill="#E1E4E8">inStock()}</tspan></text>
    <text x="18" y="91.0" xml:space="preserve" style="white-space:pre"><tspan fill="#E1E4E8">    &lt;</tspan><tspan fill="#85E89D">h2</tspan><tspan fill="#E1E4E8"> </tspan><tspan fill="#B392F0">class</tspan><tspan fill="#E1E4E8">=</tspan><tspan fill="#9ECBFF">"card__title"</tspan><tspan fill="#E1E4E8">&gt;{$product.title</tspan><tspan fill="#F97583">|</tspan><tspan fill="#B392F0">upper</tspan><tspan fill="#E1E4E8">}&lt;/</tspan><tspan fill="#85E89D">h2</tspan><tspan fill="#E1E4E8">&gt;</tspan></text>
    <text x="18" y="111.0" xml:space="preserve" style="white-space:pre"><tspan fill="#E1E4E8">    &lt;</tspan><tspan fill="#85E89D">p</tspan><tspan fill="#E1E4E8"> </tspan><tspan fill="#B392F0">class</tspan><tspan fill="#E1E4E8">=</tspan><tspan fill="#9ECBFF">"card__price"</tspan><tspan fill="#E1E4E8">&gt;{$product.price} {$.</tspan><tspan fill="#79B8FF">const</tspan><tspan fill="#E1E4E8">.CURRENCY}&lt;/</tspan><tspan fill="#85E89D">p</tspan><tspan fill="#E1E4E8">&gt;</tspan></text>
    <text x="18" y="131.0" xml:space="preserve" style="white-space:pre"></text>
    <text x="18" y="151.0" xml:space="preserve" style="white-space:pre"><tspan fill="#E1E4E8">    {</tspan><tspan fill="#F97583">foreach</tspan><tspan fill="#E1E4E8"> $product.tags </tspan><tspan fill="#79B8FF">as</tspan><tspan fill="#E1E4E8"> $tag}</tspan></text>
    <text x="18" y="171.0" xml:space="preserve" style="white-space:pre"><tspan fill="#E1E4E8">      &lt;</tspan><tspan fill="#85E89D">span</tspan><tspan fill="#E1E4E8"> </tspan><tspan fill="#B392F0">class</tspan><tspan fill="#E1E4E8">=</tspan><tspan fill="#9ECBFF">"tag"</tspan><tspan fill="#E1E4E8">&gt;{$tag}&lt;/</tspan><tspan fill="#85E89D">span</tspan><tspan fill="#E1E4E8">&gt;</tspan></text>
    <text x="18" y="191.0" xml:space="preserve" style="white-space:pre"><tspan fill="#E1E4E8">    {</tspan><tspan fill="#F97583">foreachelse</tspan><tspan fill="#E1E4E8">}</tspan></text>
    <text x="18" y="211.0" xml:space="preserve" style="white-space:pre"><tspan fill="#E1E4E8">      &lt;</tspan><tspan fill="#85E89D">span</tspan><tspan fill="#E1E4E8"> </tspan><tspan fill="#B392F0">class</tspan><tspan fill="#E1E4E8">=</tspan><tspan fill="#9ECBFF">"tag tag--empty"</tspan><tspan fill="#E1E4E8">&gt;no tags yet&lt;/</tspan><tspan fill="#85E89D">span</tspan><tspan fill="#E1E4E8">&gt;</tspan></text>
    <text x="18" y="231.0" xml:space="preserve" style="white-space:pre"><tspan fill="#E1E4E8">    {/</tspan><tspan fill="#F97583">foreach</tspan><tspan fill="#E1E4E8">}</tspan></text>
    <text x="18" y="251.0" xml:space="preserve" style="white-space:pre"><tspan fill="#E1E4E8">  {</tspan><tspan fill="#F97583">else</tspan><tspan fill="#E1E4E8">}</tspan></text>
    <text x="18" y="271.0" xml:space="preserve" style="white-space:pre"><tspan fill="#E1E4E8">    &lt;</tspan><tspan fill="#85E89D">p</tspan><tspan fill="#E1E4E8">&gt;{</tspan><tspan fill="#79B8FF">$_modx</tspan><tspan fill="#F97583">-&gt;</tspan><tspan fill="#E1E4E8">lexicon(</tspan><tspan fill="#9ECBFF">'shop_out_of_stock'</tspan><tspan fill="#E1E4E8">)}&lt;/</tspan><tspan fill="#85E89D">p</tspan><tspan fill="#E1E4E8">&gt;</tspan></text>
    <text x="18" y="291.0" xml:space="preserve" style="white-space:pre"><tspan fill="#E1E4E8">  {/</tspan><tspan fill="#F97583">if</tspan><tspan fill="#E1E4E8">}</tspan></text>
    <text x="18" y="311.0" xml:space="preserve" style="white-space:pre"><tspan fill="#E1E4E8">&lt;/</tspan><tspan fill="#85E89D">article</tspan><tspan fill="#E1E4E8">&gt;</tspan></text>
  </g>
</svg>
