<svg xmlns="http://www.w3.org/2000/svg" width="551" height="336" viewBox="0 0 551 336" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <rect width="551" height="336" rx="8" fill="#fff"/>
  <g xml:space="preserve">
    <text y="31.0"><tspan x="18.0" fill="#6A737D">{* Product card *}</tspan></text>
    <text y="51.0"><tspan x="18.0" fill="#24292E">&lt;</tspan><tspan x="25.8" fill="#22863A">article</tspan><tspan x="88.2" fill="#6F42C1">class</tspan><tspan x="127.2" fill="#24292E">=</tspan><tspan x="135.0" fill="#032F62">"card"</tspan><tspan x="181.8" fill="#24292E">&gt;</tspan></text>
    <text y="71.0"><tspan x="18.0" fill="#24292E">  {</tspan><tspan x="41.4" fill="#D73A49">if</tspan><tspan x="57.0" fill="#24292E"> $product</tspan><tspan x="127.2" fill="#D73A49">-&gt;</tspan><tspan x="142.8" fill="#24292E">inStock()}</tspan></text>
    <text y="91.0"><tspan x="18.0" fill="#24292E">    &lt;</tspan><tspan x="57.0" fill="#22863A">h2</tspan><tspan x="80.4" fill="#6F42C1">class</tspan><tspan x="119.4" fill="#24292E">=</tspan><tspan x="127.2" fill="#032F62">"card__title"</tspan><tspan x="228.6" fill="#24292E">&gt;{$product.title</tspan><tspan x="353.4" fill="#D73A49">|</tspan><tspan x="361.2" fill="#6F42C1">upper</tspan><tspan x="400.2" fill="#24292E">}&lt;/</tspan><tspan x="423.6" fill="#22863A">h2</tspan><tspan x="439.2" fill="#24292E">&gt;</tspan></text>
    <text y="111.0"><tspan x="18.0" fill="#24292E">    &lt;</tspan><tspan x="57.0" fill="#22863A">p</tspan><tspan x="72.6" fill="#6F42C1">class</tspan><tspan x="111.6" fill="#24292E">=</tspan><tspan x="119.4" fill="#032F62">"card__price"</tspan><tspan x="220.8" fill="#24292E">&gt;{$product.price} {$.</tspan><tspan x="384.6" fill="#005CC5">const</tspan><tspan x="423.6" fill="#24292E">.CURRENCY}&lt;/</tspan><tspan x="517.2" fill="#22863A">p</tspan><tspan x="525.0" fill="#24292E">&gt;</tspan></text>
    <text y="151.0"><tspan x="18.0" fill="#24292E">    {</tspan><tspan x="57.0" fill="#D73A49">foreach</tspan><tspan x="111.6" fill="#24292E"> $product.tags </tspan><tspan x="228.6" fill="#005CC5">as</tspan><tspan x="244.2" fill="#24292E"> $tag}</tspan></text>
    <text y="171.0"><tspan x="18.0" fill="#24292E">      &lt;</tspan><tspan x="72.6" fill="#22863A">span</tspan><tspan x="111.6" fill="#6F42C1">class</tspan><tspan x="150.6" fill="#24292E">=</tspan><tspan x="158.4" fill="#032F62">"tag"</tspan><tspan x="197.4" fill="#24292E">&gt;{$tag}&lt;/</tspan><tspan x="267.6" fill="#22863A">span</tspan><tspan x="298.8" fill="#24292E">&gt;</tspan></text>
    <text y="191.0"><tspan x="18.0" fill="#24292E">    {</tspan><tspan x="57.0" fill="#D73A49">foreachelse</tspan><tspan x="142.8" fill="#24292E">}</tspan></text>
    <text y="211.0"><tspan x="18.0" fill="#24292E">      &lt;</tspan><tspan x="72.6" fill="#22863A">span</tspan><tspan x="111.6" fill="#6F42C1">class</tspan><tspan x="150.6" fill="#24292E">=</tspan><tspan x="158.4" fill="#032F62">"tag tag--empty"</tspan><tspan x="283.2" fill="#24292E">&gt;no tags yet&lt;/</tspan><tspan x="392.4" fill="#22863A">span</tspan><tspan x="423.6" fill="#24292E">&gt;</tspan></text>
    <text y="231.0"><tspan x="18.0" fill="#24292E">    {/</tspan><tspan x="64.8" fill="#D73A49">foreach</tspan><tspan x="119.4" fill="#24292E">}</tspan></text>
    <text y="251.0"><tspan x="18.0" fill="#24292E">  {</tspan><tspan x="41.4" fill="#D73A49">else</tspan><tspan x="72.6" fill="#24292E">}</tspan></text>
    <text y="271.0"><tspan x="18.0" fill="#24292E">    &lt;</tspan><tspan x="57.0" fill="#22863A">p</tspan><tspan x="64.8" fill="#24292E">&gt;{</tspan><tspan x="80.4" fill="#005CC5">$_modx</tspan><tspan x="127.2" fill="#D73A49">-&gt;</tspan><tspan x="142.8" fill="#24292E">lexicon(</tspan><tspan x="205.2" fill="#032F62">'shop_out_of_stock'</tspan><tspan x="353.4" fill="#24292E">)}&lt;/</tspan><tspan x="384.6" fill="#22863A">p</tspan><tspan x="392.4" fill="#24292E">&gt;</tspan></text>
    <text y="291.0"><tspan x="18.0" fill="#24292E">  {/</tspan><tspan x="49.2" fill="#D73A49">if</tspan><tspan x="64.8" fill="#24292E">}</tspan></text>
    <text y="311.0"><tspan x="18.0" fill="#24292E">&lt;/</tspan><tspan x="33.6" fill="#22863A">article</tspan><tspan x="88.2" fill="#24292E">&gt;</tspan></text>
  </g>
</svg>
