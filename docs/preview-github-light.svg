<svg xmlns="http://www.w3.org/2000/svg" width="551" height="336" viewBox="0 0 551 336" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <rect width="551" height="336" rx="8" fill="#fff"/>
  <g>
    <text x="18" y="31.0" xml:space="preserve" style="white-space:pre"><tspan fill="#6A737D">{* Product card *}</tspan></text>
    <text x="18" y="51.0" xml:space="preserve" style="white-space:pre"><tspan fill="#24292E">&lt;</tspan><tspan fill="#22863A">article</tspan><tspan fill="#24292E"> </tspan><tspan fill="#6F42C1">class</tspan><tspan fill="#24292E">=</tspan><tspan fill="#032F62">"card"</tspan><tspan fill="#24292E">&gt;</tspan></text>
    <text x="18" y="71.0" xml:space="preserve" style="white-space:pre"><tspan fill="#24292E">  {</tspan><tspan fill="#D73A49">if</tspan><tspan fill="#24292E"> $product</tspan><tspan fill="#D73A49">-&gt;</tspan><tspan fill="#24292E">inStock()}</tspan></text>
    <text x="18" y="91.0" xml:space="preserve" style="white-space:pre"><tspan fill="#24292E">    &lt;</tspan><tspan fill="#22863A">h2</tspan><tspan fill="#24292E"> </tspan><tspan fill="#6F42C1">class</tspan><tspan fill="#24292E">=</tspan><tspan fill="#032F62">"card__title"</tspan><tspan fill="#24292E">&gt;{$product.title</tspan><tspan fill="#D73A49">|</tspan><tspan fill="#6F42C1">upper</tspan><tspan fill="#24292E">}&lt;/</tspan><tspan fill="#22863A">h2</tspan><tspan fill="#24292E">&gt;</tspan></text>
    <text x="18" y="111.0" xml:space="preserve" style="white-space:pre"><tspan fill="#24292E">    &lt;</tspan><tspan fill="#22863A">p</tspan><tspan fill="#24292E"> </tspan><tspan fill="#6F42C1">class</tspan><tspan fill="#24292E">=</tspan><tspan fill="#032F62">"card__price"</tspan><tspan fill="#24292E">&gt;{$product.price} {$.</tspan><tspan fill="#005CC5">const</tspan><tspan fill="#24292E">.CURRENCY}&lt;/</tspan><tspan fill="#22863A">p</tspan><tspan fill="#24292E">&gt;</tspan></text>
    <text x="18" y="131.0" xml:space="preserve" style="white-space:pre"></text>
    <text x="18" y="151.0" xml:space="preserve" style="white-space:pre"><tspan fill="#24292E">    {</tspan><tspan fill="#D73A49">foreach</tspan><tspan fill="#24292E"> $product.tags </tspan><tspan fill="#005CC5">as</tspan><tspan fill="#24292E"> $tag}</tspan></text>
    <text x="18" y="171.0" xml:space="preserve" style="white-space:pre"><tspan fill="#24292E">      &lt;</tspan><tspan fill="#22863A">span</tspan><tspan fill="#24292E"> </tspan><tspan fill="#6F42C1">class</tspan><tspan fill="#24292E">=</tspan><tspan fill="#032F62">"tag"</tspan><tspan fill="#24292E">&gt;{$tag}&lt;/</tspan><tspan fill="#22863A">span</tspan><tspan fill="#24292E">&gt;</tspan></text>
    <text x="18" y="191.0" xml:space="preserve" style="white-space:pre"><tspan fill="#24292E">    {</tspan><tspan fill="#D73A49">foreachelse</tspan><tspan fill="#24292E">}</tspan></text>
    <text x="18" y="211.0" xml:space="preserve" style="white-space:pre"><tspan fill="#24292E">      &lt;</tspan><tspan fill="#22863A">span</tspan><tspan fill="#24292E"> </tspan><tspan fill="#6F42C1">class</tspan><tspan fill="#24292E">=</tspan><tspan fill="#032F62">"tag tag--empty"</tspan><tspan fill="#24292E">&gt;no tags yet&lt;/</tspan><tspan fill="#22863A">span</tspan><tspan fill="#24292E">&gt;</tspan></text>
    <text x="18" y="231.0" xml:space="preserve" style="white-space:pre"><tspan fill="#24292E">    {/</tspan><tspan fill="#D73A49">foreach</tspan><tspan fill="#24292E">}</tspan></text>
    <text x="18" y="251.0" xml:space="preserve" style="white-space:pre"><tspan fill="#24292E">  {</tspan><tspan fill="#D73A49">else</tspan><tspan fill="#24292E">}</tspan></text>
    <text x="18" y="271.0" xml:space="preserve" style="white-space:pre"><tspan fill="#24292E">    &lt;</tspan><tspan fill="#22863A">p</tspan><tspan fill="#24292E">&gt;{</tspan><tspan fill="#005CC5">$_modx</tspan><tspan fill="#D73A49">-&gt;</tspan><tspan fill="#24292E">lexicon(</tspan><tspan fill="#032F62">'shop_out_of_stock'</tspan><tspan fill="#24292E">)}&lt;/</tspan><tspan fill="#22863A">p</tspan><tspan fill="#24292E">&gt;</tspan></text>
    <text x="18" y="291.0" xml:space="preserve" style="white-space:pre"><tspan fill="#24292E">  {/</tspan><tspan fill="#D73A49">if</tspan><tspan fill="#24292E">}</tspan></text>
    <text x="18" y="311.0" xml:space="preserve" style="white-space:pre"><tspan fill="#24292E">&lt;/</tspan><tspan fill="#22863A">article</tspan><tspan fill="#24292E">&gt;</tspan></text>
  </g>
